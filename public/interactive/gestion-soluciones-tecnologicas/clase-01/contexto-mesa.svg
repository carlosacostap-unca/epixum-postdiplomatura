<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc"><title id="title">La mesa de trabajo del contexto</title><desc id="desc">Una mesa limitada reúne instrucciones, mensajes, fragmentos de archivos y resultados de herramientas disponibles para la respuesta. Un archivo guardado fuera de esa mesa puede necesitar recuperarse.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#7ee6c1" stroke-width="1.5"/></marker></defs><rect width="1280" height="560" rx="24" fill="#101c2b"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="38" text-anchor="start" font-size="18" fill="#b6c9db" font-weight="700"><tspan x="36" dy="0">GESTIÓN TECNOLÓGICA  /  BASES DE INTELIGENCIA ARTIFICIAL</tspan></text><text x="36" y="100" text-anchor="start" font-size="40" fill="#f1f6fc" font-weight="700"><tspan x="36" dy="0">Contexto: lo que está disponible ahora</tspan></text><rect x="36" y="151" width="875" height="314" rx="22" fill="#1c3747" stroke="#7ee6c1" stroke-width="2"/><text x="62" y="192" text-anchor="start" font-size="25" fill="#7ee6c1" font-weight="700"><tspan x="62" dy="0">MESA DE TRABAJO · CAPACIDAD LIMITADA</tspan></text><rect x="66" y="224" width="183" height="179" rx="22" fill="#101c2b" stroke="#36526a" stroke-width="2"/><g transform="translate(123 244) scale(1)" fill="none" stroke="#7ee6c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h60v43H32L17 65V51H6z"/><path d="M19 22h34M19 35h23"/></g><text x="157" y="374" text-anchor="middle" font-size="23" fill="#f1f6fc" font-weight="500"><tspan x="157" dy="0">Instrucciones</tspan></text><rect x="277" y="224" width="183" height="179" rx="22" fill="#101c2b" stroke="#36526a" stroke-width="2"/><g transform="translate(334 244) scale(1)" fill="none" stroke="#7ee6c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h31l15 15v51H15zM46 4v17h15M25 34h25M25 46h25M25 58h15"/></g><text x="368" y="374" text-anchor="middle" font-size="23" fill="#f1f6fc" font-weight="500"><tspan x="368" dy="0">Mensajes</tspan></text><rect x="488" y="224" width="183" height="179" rx="22" fill="#101c2b" stroke="#36526a" stroke-width="2"/><g transform="translate(545 244) scale(1)" fill="none" stroke="#7ee6c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h26l7 10h29v37H5zM5 17V9h23l8 8h28v10"/></g><text x="579" y="374" text-anchor="middle" font-size="23" fill="#f1f6fc" font-weight="500"><tspan x="579" dy="0">Fragmentos</tspan></text><rect x="699" y="224" width="183" height="179" rx="22" fill="#101c2b" stroke="#36526a" stroke-width="2"/><g transform="translate(756 244) scale(1)" fill="none" stroke="#7ee6c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M48 6a22 22 0 0 0-25 28L6 51a11 11 0 0 0 15 15l17-17A22 22 0 0 0 65 23L49 36 36 23z"/></g><text x="790" y="374" text-anchor="middle" font-size="23" fill="#f1f6fc" font-weight="500"><tspan x="790" dy="0">Resultados</tspan></text><g transform="translate(1022 194) scale(1.3)" fill="none" stroke="#c6b2ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h26l7 10h29v37H5zM5 17V9h23l8 8h28v10"/></g><text x="1077" y="328" text-anchor="middle" font-size="29" fill="#c6b2ff" font-weight="600"><tspan x="1077" dy="0">Archivo</tspan><tspan x="1077" dy="37.7">guardado</tspan></text><path d="M1010 385H929" fill="none" stroke="#7ee6c1" stroke-width="4" marker-end="url(#a)"/><text x="995" y="428" text-anchor="start" font-size="24" fill="#b6c9db" font-weight="400"><tspan x="995" dy="0">Recuperar</tspan></text><text x="36" y="520" text-anchor="start" font-size="27" fill="#ffd08a" font-weight="400"><tspan x="36" dy="0">Analogía: no todo el historial visible está siempre dentro del contexto.</tspan></text></g></svg>
