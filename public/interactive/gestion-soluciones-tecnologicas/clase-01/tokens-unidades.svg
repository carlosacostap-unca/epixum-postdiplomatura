<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc"><title id="title">Tokens como unidades de procesamiento</title><desc id="desc">Una frase se representa como unidades de procesamiento. Cada unidad puede ser palabra, parte de palabra o signo. La segmentación dibujada es ilustrativa y no corresponde a un tokenizer real.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#7ee6c1" stroke-width="1.5"/></marker></defs><rect width="1280" height="560" rx="24" fill="#101c2b"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="38" text-anchor="start" font-size="18" fill="#b6c9db" font-weight="700"><tspan x="36" dy="0">GESTIÓN TECNOLÓGICA  /  BASES DE INTELIGENCIA ARTIFICIAL</tspan></text><text x="36" y="100" text-anchor="start" font-size="40" fill="#f1f6fc" font-weight="700"><tspan x="36" dy="0">El texto se procesa en unidades</tspan></text><text x="640" y="180" text-anchor="middle" font-size="39" fill="#f1f6fc" font-weight="500"><tspan x="640" dy="0">«Prepará una invitación breve.»</tspan></text><path d="M640 205V263" fill="none" stroke="#7ee6c1" stroke-width="4" marker-end="url(#a)"/><rect x="96" y="294" width="162" height="82" rx="12" fill="#1d443f" stroke="#7ee6c1" stroke-width="2"/><text x="177" y="346" text-anchor="middle" font-size="29" fill="#f1f6fc" font-weight="600"><tspan x="177" dy="0">Prepará</tspan></text><rect x="276" y="294" width="100" height="82" rx="12" fill="#302e49" stroke="#c6b2ff" stroke-width="2"/><text x="326" y="346" text-anchor="middle" font-size="29" fill="#f1f6fc" font-weight="600"><tspan x="326" dy="0">una</tspan></text><rect x="394" y="294" width="100" height="82" rx="12" fill="#1d443f" stroke="#7ee6c1" stroke-width="2"/><text x="444" y="346" text-anchor="middle" font-size="29" fill="#f1f6fc" font-weight="600"><tspan x="444" dy="0">in</tspan></text><rect x="512" y="294" width="160" height="82" rx="12" fill="#302e49" stroke="#c6b2ff" stroke-width="2"/><text x="592" y="346" text-anchor="middle" font-size="29" fill="#f1f6fc" font-weight="600"><tspan x="592" dy="0">vitación</tspan></text><rect x="690" y="294" width="130" height="82" rx="12" fill="#1d443f" stroke="#7ee6c1" stroke-width="2"/><text x="755" y="346" text-anchor="middle" font-size="29" fill="#f1f6fc" font-weight="600"><tspan x="755" dy="0">breve</tspan></text><rect x="838" y="294" width="64" height="82" rx="12" fill="#302e49" stroke="#c6b2ff" stroke-width="2"/><text x="870" y="346" text-anchor="middle" font-size="29" fill="#f1f6fc" font-weight="600"><tspan x="870" dy="0">.</tspan></text><text x="953" y="339" text-anchor="start" font-size="29" fill="#ffd08a" font-weight="700"><tspan x="953" dy="0">TOKENS</tspan><tspan x="953" dy="37.7">≠ palabras</tspan></text><text x="36" y="456" text-anchor="start" font-size="27" fill="#b6c9db" font-weight="400"><tspan x="36" dy="0">Segmentación ilustrativa: varía según el modelo y el idioma.</tspan></text><text x="36" y="505" text-anchor="start" font-size="29" fill="#7ee6c1" font-weight="700"><tspan x="36" dy="0">No necesitamos contarlos a mano.</tspan></text></g></svg>
