<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc"><title id="title">Un flujo con validación y aprobación humana</title><desc id="desc">Un formulario inicia el registro y la clasificación. Si la validación falla, el flujo detiene el envío y deriva a revisión. Si valida, una persona revisa y aprueba antes del envío. Una excepción no se envía automáticamente. Es un esquema didáctico, no una integración activa.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#76e5b6" stroke-width="1.5"/></marker></defs><rect width="1400" height="620" rx="26" fill="#101821"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="45" font-size="20" fill="#a4b6ca" font-weight="700"><tspan x="40" dy="0">GESTIÓN TECNOLÓGICA + AUTOMATIZACIÓN  /  CLASE 1</tspan></text><text x="40" y="108" font-size="40" fill="#edf4fc" font-weight="700"><tspan x="40" dy="0">La aprobación es un paso del flujo</tspan></text><rect x="40" y="156" width="245" height="170" rx="20" fill="#1b2b3b" stroke="#40556b" stroke-width="2"/><circle cx="77" cy="195" r="25" fill="#76e5b6"/><text x="68" y="205" font-size="28" fill="#101821" font-weight="700"><tspan x="68" dy="0">1</tspan></text><text x="63" y="249" font-size="23" fill="#76e5b6" font-weight="700"><tspan x="63" dy="0">FORMULARIO</tspan></text><text x="63" y="284" font-size="24" fill="#edf4fc" font-weight="400"><tspan x="63" dy="0">Entrada</tspan><tspan x="63" dy="32.400000000000006">prevista</tspan></text><rect x="305" y="156" width="245" height="170" rx="20" fill="#1b2b3b" stroke="#40556b" stroke-width="2"/><circle cx="342" cy="195" r="25" fill="#76e5b6"/><text x="333" y="205" font-size="28" fill="#101821" font-weight="700"><tspan x="333" dy="0">2</tspan></text><text x="328" y="249" font-size="23" fill="#76e5b6" font-weight="700"><tspan x="328" dy="0">REGISTRO</tspan></text><text x="328" y="284" font-size="24" fill="#edf4fc" font-weight="400"><tspan x="328" dy="0">Guardar</tspan><tspan x="328" dy="32.400000000000006">el caso</tspan></text><rect x="570" y="156" width="245" height="170" rx="20" fill="#1b2b3b" stroke="#40556b" stroke-width="2"/><circle cx="607" cy="195" r="25" fill="#76e5b6"/><text x="598" y="205" font-size="28" fill="#101821" font-weight="700"><tspan x="598" dy="0">3</tspan></text><text x="593" y="249" font-size="23" fill="#76e5b6" font-weight="700"><tspan x="593" dy="0">CLASIFICAR</tspan></text><text x="593" y="284" font-size="24" fill="#edf4fc" font-weight="400"><tspan x="593" dy="0">Normalizar</tspan><tspan x="593" dy="32.400000000000006">y marcar</tspan></text><rect x="835" y="156" width="245" height="170" rx="20" fill="#1b2b3b" stroke="#40556b" stroke-width="2"/><circle cx="872" cy="195" r="25" fill="#76e5b6"/><text x="863" y="205" font-size="28" fill="#101821" font-weight="700"><tspan x="863" dy="0">4</tspan></text><text x="858" y="249" font-size="23" fill="#76e5b6" font-weight="700"><tspan x="858" dy="0">VALIDAR</tspan></text><text x="858" y="284" font-size="24" fill="#edf4fc" font-weight="400"><tspan x="858" dy="0">Datos y</tspan><tspan x="858" dy="32.400000000000006">resultado</tspan></text><path d="M290 240 H298" fill="none" stroke="#76e5b6" stroke-width="4" marker-end="url(#arrow)"/><path d="M555 240 H563" fill="none" stroke="#76e5b6" stroke-width="4" marker-end="url(#arrow)"/><path d="M820 240 H828" fill="none" stroke="#76e5b6" stroke-width="4" marker-end="url(#arrow)"/><text x="1110" y="218" font-size="24" fill="#76e5b6" font-weight="700"><tspan x="1110" dy="0">¿VÁLIDO?</tspan></text><path d="M1085 240 H1230 V367" fill="none" stroke="#76e5b6" stroke-width="4" marker-end="url(#arrow)"/><text x="1250" y="323" font-size="24" fill="#76e5b6" font-weight="700"><tspan x="1250" dy="0">SÍ</tspan></text><rect x="650" y="380" width="710" height="152" rx="20" fill="#392e2b" stroke="#ffbb9b" stroke-width="2"/><text x="680" y="425" font-size="30" fill="#ffbb9b" font-weight="700"><tspan x="680" dy="0">5 · PERSONA REVISA Y APRUEBA</tspan></text><text x="680" y="475" font-size="29" fill="#edf4fc" font-weight="400"><tspan x="680" dy="0">Destinatario + contenido → 6 · Envío</tspan></text><path d="M950 335 V351 H300 V373" fill="none" stroke="#76e5b6" stroke-width="4" marker-end="url(#arrow)"/><text x="615" y="351" font-size="23" fill="#ffbb9b" font-weight="700"><tspan x="615" dy="0">NO</tspan></text><rect x="40" y="380" width="560" height="152" rx="20" fill="#1b2b3b" stroke="#40556b" stroke-width="2"/><text x="68" y="427" font-size="30" fill="#ffbb9b" font-weight="700"><tspan x="68" dy="0">DETENER Y DERIVAR</tspan></text><text x="68" y="475" font-size="27" fill="#edf4fc" font-weight="400"><tspan x="68" dy="0">Corregir antes de volver a validar</tspan></text><text x="40" y="584" font-size="27" fill="#a4b6ca" font-weight="400"><tspan x="40" dy="0">Esquema didáctico · Preparar un mensaje no autoriza a enviarlo.</tspan></text></g></svg>
