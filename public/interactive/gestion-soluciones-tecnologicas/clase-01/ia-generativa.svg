<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc"><title id="title">IA generativa: producir contenido</title><desc id="desc">Una entrada con instrucciones y datos pasa por un modelo generativo y produce texto, imagen, audio o código, según sus capacidades. Generar no equivale a verificar.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#7ee6c1" stroke-width="1.5"/></marker></defs><rect width="1280" height="560" rx="24" fill="#101c2b"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="38" text-anchor="start" font-size="18" fill="#b6c9db" font-weight="700"><tspan x="36" dy="0">GESTIÓN TECNOLÓGICA  /  BASES DE INTELIGENCIA ARTIFICIAL</tspan></text><text x="36" y="100" text-anchor="start" font-size="40" fill="#f1f6fc" font-weight="700"><tspan x="36" dy="0">De una entrada a contenido generado</tspan></text><rect x="36" y="158" width="305" height="240" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><g transform="translate(60 180) scale(1)" fill="none" stroke="#7ee6c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h60v43H32L17 65V51H6z"/><path d="M19 22h34M19 35h23"/></g><text x="60" y="291" text-anchor="start" font-size="31" fill="#7ee6c1" font-weight="700"><tspan x="60" dy="0">Entrada</tspan></text><text x="60" y="338" text-anchor="start" font-size="27" fill="#f1f6fc" font-weight="400"><tspan x="60" dy="0">Instrucciones</tspan><tspan x="60" dy="35.1">y datos</tspan></text><path d="M354 279H450" fill="none" stroke="#7ee6c1" stroke-width="4" marker-end="url(#a)"/><rect x="466" y="158" width="345" height="240" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><g transform="translate(490 180) scale(1)" fill="none" stroke="#c6b2ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="17" y="17" width="38" height="38" rx="7"/><path d="M27 4v13M45 4v13M27 55v13M45 55v13M4 27h13M4 45h13M55 27h13M55 45h13"/><circle cx="36" cy="36" r="8"/></g><text x="490" y="291" text-anchor="start" font-size="31" fill="#c6b2ff" font-weight="700"><tspan x="490" dy="0">Modelo</tspan></text><text x="490" y="338" text-anchor="start" font-size="27" fill="#f1f6fc" font-weight="400"><tspan x="490" dy="0">Patrones aprendidos</tspan><tspan x="490" dy="35.1">durante entrenamiento</tspan></text><path d="M824 279H920" fill="none" stroke="#7ee6c1" stroke-width="4" marker-end="url(#a)"/><rect x="936" y="158" width="308" height="240" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><g transform="translate(960 180) scale(1)" fill="none" stroke="#7ee6c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h31l15 15v51H15zM46 4v17h15M25 34h25M25 46h25M25 58h15"/></g><text x="960" y="291" text-anchor="start" font-size="31" fill="#7ee6c1" font-weight="700"><tspan x="960" dy="0">Contenido</tspan></text><text x="960" y="338" text-anchor="start" font-size="27" fill="#f1f6fc" font-weight="400"><tspan x="960" dy="0">Texto, imagen,</tspan><tspan x="960" dy="35.1">audio o código</tspan></text><text x="36" y="487" text-anchor="start" font-size="29" fill="#ffd08a" font-weight="600"><tspan x="36" dy="0">Generar una respuesta no demuestra que sea verdadera.</tspan></text></g></svg>
