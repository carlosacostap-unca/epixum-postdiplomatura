<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc"><title id="title">Un agente usa resultados para decidir cómo seguir</title><desc id="desc">Con un objetivo y límites, el agente elige una acción, usa una herramienta, observa su resultado y decide el siguiente paso o cuándo detenerse. Una persona interviene cuando corresponde.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#7ee6c1" stroke-width="1.5"/></marker></defs><rect width="1280" height="560" rx="24" fill="#101c2b"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="38" text-anchor="start" font-size="18" fill="#b6c9db" font-weight="700"><tspan x="36" dy="0">GESTIÓN TECNOLÓGICA  /  BASES DE INTELIGENCIA ARTIFICIAL</tspan></text><text x="36" y="98" text-anchor="start" font-size="40" fill="#f1f6fc" font-weight="700"><tspan x="36" dy="0">Un agente decide cómo continuar</tspan></text><rect x="36" y="150" width="292" height="324" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><g transform="translate(64 176) scale(1)" fill="none" stroke="#ffd08a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="20" r="14"/><path d="M9 69v-8a27 27 0 0 1 54 0v8"/></g><text x="64" y="282" text-anchor="start" font-size="34" fill="#ffd08a" font-weight="700"><tspan x="64" dy="0">Objetivo</tspan><tspan x="64" dy="44.2">y límites</tspan></text><text x="64" y="390" text-anchor="start" font-size="27" fill="#f1f6fc" font-weight="400"><tspan x="64" dy="0">Permisos y</tspan><tspan x="64" dy="35.1">revisión humana</tspan></text><path d="M343 311H406" fill="none" stroke="#7ee6c1" stroke-width="4" marker-end="url(#a)"/><rect x="430" y="149" width="354" height="114" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><text x="458" y="195" text-anchor="start" font-size="29" fill="#7ee6c1" font-weight="700"><tspan x="458" dy="0">1 · Elegir</tspan><tspan x="458" dy="37.7">la próxima acción</tspan></text><path d="M798 206H846" fill="none" stroke="#7ee6c1" stroke-width="4" marker-end="url(#a)"/><rect x="865" y="149" width="379" height="114" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><text x="895" y="195" text-anchor="start" font-size="29" fill="#f1f6fc" font-weight="700"><tspan x="895" dy="0">2 · Usar</tspan><tspan x="895" dy="37.7">una herramienta</tspan></text><path d="M1054 276V333" fill="none" stroke="#7ee6c1" stroke-width="4" marker-end="url(#a)"/><rect x="865" y="351" width="379" height="123" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><text x="895" y="397" text-anchor="start" font-size="29" fill="#c6b2ff" font-weight="700"><tspan x="895" dy="0">3 · Observar</tspan><tspan x="895" dy="37.7">el resultado</tspan></text><path d="M850 412H800" fill="none" stroke="#7ee6c1" stroke-width="4" marker-end="url(#a)"/><rect x="430" y="351" width="354" height="123" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><text x="458" y="397" text-anchor="start" font-size="29" fill="#f1f6fc" font-weight="700"><tspan x="458" dy="0">4 · Continuar</tspan><tspan x="458" dy="37.7">o detenerse</tspan></text><path d="M608 336V280" fill="none" stroke="#7ee6c1" stroke-width="4" marker-end="url(#a)"/><text x="36" y="529" text-anchor="start" font-size="25" fill="#b6c9db" font-weight="400"><tspan x="36" dy="0">Esquema conceptual: la autonomía depende del diseño y los permisos.</tspan></text></g></svg>
