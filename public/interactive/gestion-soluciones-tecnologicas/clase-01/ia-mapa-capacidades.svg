<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc"><title id="title">Distintas capacidades de la IA</title><desc id="desc">IA es un campo amplio. Reconocer patrones, interpretar lenguaje, predecir y generar contenido son capacidades que pueden combinarse. Un aviso con una regla fija no requiere IA.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#7ee6c1" stroke-width="1.5"/></marker></defs><rect width="1280" height="560" rx="24" fill="#101c2b"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="38" text-anchor="start" font-size="18" fill="#b6c9db" font-weight="700"><tspan x="36" dy="0">GESTIÓN TECNOLÓGICA  /  BASES DE INTELIGENCIA ARTIFICIAL</tspan></text><text x="36" y="100" text-anchor="start" font-size="40" fill="#f1f6fc" font-weight="700"><tspan x="36" dy="0">La IA reúne distintas capacidades</tspan></text><rect x="36" y="151" width="266" height="240" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><g transform="translate(60 173) scale(1)" fill="none" stroke="#7ee6c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="29" cy="29" r="23"/><path d="m46 46 22 22M17 28h23M28 17v23"/></g><text x="60" y="284" text-anchor="start" font-size="31" fill="#7ee6c1" font-weight="700"><tspan x="60" dy="0">Reconocer</tspan></text><text x="60" y="331" text-anchor="start" font-size="27" fill="#f1f6fc" font-weight="400"><tspan x="60" dy="0">Patrones y señales</tspan></text><rect x="350" y="151" width="266" height="240" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><g transform="translate(374 173) scale(1)" fill="none" stroke="#7ee6c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h60v43H32L17 65V51H6z"/><path d="M19 22h34M19 35h23"/></g><text x="374" y="284" text-anchor="start" font-size="31" fill="#7ee6c1" font-weight="700"><tspan x="374" dy="0">Interpretar</tspan></text><text x="374" y="331" text-anchor="start" font-size="27" fill="#f1f6fc" font-weight="400"><tspan x="374" dy="0">Lenguaje y voz</tspan></text><rect x="664" y="151" width="266" height="240" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><g transform="translate(688 173) scale(1)" fill="none" stroke="#7ee6c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="17" y="17" width="38" height="38" rx="7"/><path d="M27 4v13M45 4v13M27 55v13M45 55v13M4 27h13M4 45h13M55 27h13M55 45h13"/><circle cx="36" cy="36" r="8"/></g><text x="688" y="284" text-anchor="start" font-size="31" fill="#7ee6c1" font-weight="700"><tspan x="688" dy="0">Predecir</tspan></text><text x="688" y="331" text-anchor="start" font-size="27" fill="#f1f6fc" font-weight="400"><tspan x="688" dy="0">Resultados posibles</tspan></text><rect x="978" y="151" width="266" height="240" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><g transform="translate(1002 173) scale(1)" fill="none" stroke="#7ee6c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="62" height="52" rx="6"/><circle cx="49" cy="25" r="6"/><path d="m6 53 18-22 18 22 11-12 14 19"/></g><text x="1002" y="284" text-anchor="start" font-size="31" fill="#7ee6c1" font-weight="700"><tspan x="1002" dy="0">Generar</tspan></text><text x="1002" y="331" text-anchor="start" font-size="27" fill="#f1f6fc" font-weight="400"><tspan x="1002" dy="0">Contenido nuevo</tspan></text><text x="36" y="474" text-anchor="start" font-size="29" fill="#ffd08a" font-weight="600"><tspan x="36" dy="0">Una regla fija puede automatizar una tarea sin usar IA.</tspan></text></g></svg>
