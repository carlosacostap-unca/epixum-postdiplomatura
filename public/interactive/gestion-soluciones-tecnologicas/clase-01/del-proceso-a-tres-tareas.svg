<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc"><title id="title">Del To-Be a tres tareas candidatas</title><desc id="desc">Recorré tu To-Be, identificá tareas concretas como recibir, registrar y revisar, y documentá tres candidatas. Para cada una, registrá frecuencia, entrada, señales a favor y en contra, nivel tentativo y tiempo actual. Elegí una favorita y anotá una duda por verificar.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#76e5b6" stroke-width="1.5"/></marker></defs><rect width="1400" height="620" rx="26" fill="#101821"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="45" font-size="20" fill="#a4b6ca" font-weight="700"><tspan x="40" dy="0">GESTIÓN TECNOLÓGICA + AUTOMATIZACIÓN  /  CLASE 1</tspan></text><text x="40" y="108" font-size="39" fill="#edf4fc" font-weight="700"><tspan x="40" dy="0">Buscá tareas; después justificá tu elección</tspan></text><rect x="40" y="150" width="1320" height="195" rx="20" fill="#1b2b3b" stroke="#40556b" stroke-width="2"/><text x="66" y="191" font-size="24" fill="#a4b6ca" font-weight="700"><tspan x="66" dy="0">TU PROCESO TO-BE</tspan></text><circle cx="104" cy="273" r="22" fill="none" stroke="#76e5b6" stroke-width="4"/><path d="M138 273 H182" fill="none" stroke="#76e5b6" stroke-width="4" marker-end="url(#arrow)"/><rect x="200" y="224" width="270" height="91" rx="20" fill="#253a46" stroke="#76e5b6" stroke-width="2"/><text x="231" y="280" font-size="30" fill="#edf4fc" font-weight="700"><tspan x="231" dy="0">RECIBIR</tspan></text><rect x="550" y="224" width="270" height="91" rx="20" fill="#253a46" stroke="#76e5b6" stroke-width="2"/><text x="581" y="280" font-size="30" fill="#edf4fc" font-weight="700"><tspan x="581" dy="0">REGISTRAR</tspan></text><rect x="900" y="224" width="270" height="91" rx="20" fill="#253a46" stroke="#76e5b6" stroke-width="2"/><text x="931" y="280" font-size="30" fill="#edf4fc" font-weight="700"><tspan x="931" dy="0">REVISAR</tspan></text><path d="M480 273 H532" fill="none" stroke="#76e5b6" stroke-width="4" marker-end="url(#arrow)"/><path d="M830 273 H882" fill="none" stroke="#76e5b6" stroke-width="4" marker-end="url(#arrow)"/><path d="M1181 273 H1260" fill="none" stroke="#76e5b6" stroke-width="4" marker-end="url(#arrow)"/><circle cx="1294" cy="273" r="22" fill="none" stroke="#76e5b6" stroke-width="6"/><path d="M700 356 V394" fill="none" stroke="#76e5b6" stroke-width="4" marker-end="url(#arrow)"/><rect x="40" y="410" width="425" height="117" rx="20" fill="#1b2b3b" stroke="#40556b" stroke-width="2"/><circle cx="82" cy="454" r="25" fill="#76e5b6"/><text x="73" y="464" font-size="28" fill="#101821" font-weight="700"><tspan x="73" dy="0">1</tspan></text><text x="122" y="452" font-size="25" fill="#76e5b6" font-weight="700"><tspan x="122" dy="0">TAREA CANDIDATA</tspan></text><text x="65" y="495" font-size="21" fill="#edf4fc" font-weight="400"><tspan x="65" dy="0">Entrada · frecuencia · riesgo · tiempo</tspan></text><rect x="487" y="410" width="425" height="117" rx="20" fill="#1b2b3b" stroke="#40556b" stroke-width="2"/><circle cx="529" cy="454" r="25" fill="#76e5b6"/><text x="520" y="464" font-size="28" fill="#101821" font-weight="700"><tspan x="520" dy="0">2</tspan></text><text x="569" y="452" font-size="25" fill="#76e5b6" font-weight="700"><tspan x="569" dy="0">TAREA CANDIDATA</tspan></text><text x="512" y="495" font-size="21" fill="#edf4fc" font-weight="400"><tspan x="512" dy="0">Entrada · frecuencia · riesgo · tiempo</tspan></text><rect x="934" y="410" width="425" height="117" rx="20" fill="#1b2b3b" stroke="#40556b" stroke-width="2"/><circle cx="976" cy="454" r="25" fill="#76e5b6"/><text x="967" y="464" font-size="28" fill="#101821" font-weight="700"><tspan x="967" dy="0">3</tspan></text><text x="1016" y="452" font-size="25" fill="#76e5b6" font-weight="700"><tspan x="1016" dy="0">TAREA 