<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc"><title id="title">Cuatro piezas para un pedido claro</title><desc id="desc">Un prompt puede indicar objetivo, información, destinatario y formato con límites. Son apoyos para comunicar la tarea, no una fórmula que garantice aciertos.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#7ee6c1" stroke-width="1.5"/></marker></defs><rect width="1280" height="560" rx="24" fill="#101c2b"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="38" text-anchor="start" font-size="18" fill="#b6c9db" font-weight="700"><tspan x="36" dy="0">GESTIÓN TECNOLÓGICA  /  BASES DE INTELIGENCIA ARTIFICIAL</tspan></text><text x="36" y="100" text-anchor="start" font-size="40" fill="#f1f6fc" font-weight="700"><tspan x="36" dy="0">Un pedido claro reúne piezas útiles</tspan></text><rect x="36" y="155" width="282" height="240" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><g transform="translate(60 177) scale(1)" fill="none" stroke="#7ee6c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="36" r="29"/><path d="m20 36 11 11 22-24"/></g><text x="60" y="288" text-anchor="start" font-size="31" fill="#7ee6c1" font-weight="700"><tspan x="60" dy="0">Objetivo</tspan></text><text x="60" y="335" text-anchor="start" font-size="27" fill="#f1f6fc" font-weight="400"><tspan x="60" dy="0">¿Qué querés</tspan><tspan x="60" dy="35.1">lograr?</tspan></text><rect x="342" y="155" width="282" height="240" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><g transform="translate(366 177) scale(1)" fill="none" stroke="#c6b2ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h26l7 10h29v37H5zM5 17V9h23l8 8h28v10"/></g><text x="366" y="288" text-anchor="start" font-size="31" fill="#c6b2ff" font-weight="700"><tspan x="366" dy="0">Información</tspan></text><text x="366" y="335" text-anchor="start" font-size="27" fill="#f1f6fc" font-weight="400"><tspan x="366" dy="0">¿Qué datos</tspan><tspan x="366" dy="35.1">debe usar?</tspan></text><rect x="648" y="155" width="282" height="240" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><g transform="translate(672 177) scale(1)" fill="none" stroke="#7ee6c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="20" r="14"/><path d="M9 69v-8a27 27 0 0 1 54 0v8"/></g><text x="672" y="288" text-anchor="start" font-size="31" fill="#7ee6c1" font-weight="700"><tspan x="672" dy="0">Destinatario</tspan></text><text x="672" y="335" text-anchor="start" font-size="27" fill="#f1f6fc" font-weight="400"><tspan x="672" dy="0">¿Para quién</tspan><tspan x="672" dy="35.1">es el resultado?</tspan></text><rect x="954" y="155" width="290" height="240" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><g transform="translate(978 177) scale(1)" fill="none" stroke="#ffd08a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h31l15 15v51H15zM46 4v17h15M25 34h25M25 46h25M25 58h15"/></g><text x="978" y="288" text-anchor="start" font-size="31" fill="#ffd08a" font-weight="700"><tspan x="978" dy="0">Formato</tspan></text><text x="978" y="335" text-anchor="start" font-size="27" fill="#f1f6fc" font-weight="400"><tspan x="978" dy="0">¿Cómo responder?</tspan><tspan x="978" dy="35.1">¿Qué respetar?</tspan></text><text x="36" y="481" text-anchor="start" font-size="34" fill="#7ee6c1" font-weight="700"><tspan x="36" dy="0">Pedir → leer → revisar → ajustar</tspan></text></g></svg>
