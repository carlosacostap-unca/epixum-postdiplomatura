<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc"><title id="title">El circuito de recepción de Quebrada Azul</title><desc id="desc">Caso ficticio: correo, formulario, WhatsApp y papel llegan a Sofía y Paula, que reciben y cargan comprobantes manualmente en una planilla para su seguimiento. Entradas por distintos canales pueden duplicarse; el problema está en el circuito de trabajo.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#76e5b6" stroke-width="1.5"/></marker></defs><rect width="1400" height="620" rx="26" fill="#101821"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="45" font-size="20" fill="#a4b6ca" font-weight="700"><tspan x="40" dy="0">GESTIÓN TECNOLÓGICA + AUTOMATIZACIÓN  /  CLASE 1</tspan></text><text x="40" y="108" font-size="38" fill="#edf4fc" font-weight="700"><tspan x="40" dy="0">Quebrada Azul · 5 personas · 120 clientes</tspan></text><rect x="40" y="156" width="300" height="72" rx="20" fill="#1b2b3b" stroke="#40556b" stroke-width="2"/><text x="103" y="202" font-size="27" fill="#edf4fc" font-weight="700"><tspan x="103" dy="0">CORREO</tspan></text><rect x="61" y="176" width="27" height="30" rx="4" fill="none" stroke="#76e5b6" stroke-width="3"/><path d="M349 192 H405 V330 H467" fill="none" stroke="#76e5b6" stroke-width="4" marker-end="url(#arrow)"/><rect x="40" y="248" width="300" height="72" rx="20" fill="#1b2b3b" stroke="#40556b" stroke-width="2"/><text x="103" y="294" font-size="27" fill="#edf4fc" font-weight="700"><tspan x="103" dy="0">FORMULARIO</tspan></text><rect x="61" y="268" width="27" height="30" rx="4" fill="none" stroke="#76e5b6" stroke-width="3"/><path d="M349 284 H405 V330 H467" fill="none" stroke="#76e5b6" stroke-width="4" marker-end="url(#arrow)"/><rect x="40" y="340" width="300" height="72" rx="20" fill="#1b2b3b" stroke="#40556b" stroke-width="2"/><text x="103" y="386" font-size="27" fill="#edf4fc" font-weight="700"><tspan x="103" dy="0">WHATSAPP</tspan></text><rect x="61" y="360" width="27" height="30" rx="4" fill="none" stroke="#76e5b6" stroke-width="3"/><path d="M349 376 H405 V330 H467" fill="none" stroke="#76e5b6" stroke-width="4" marker-end="url(#arrow)"/><rect x="40" y="432" width="300" height="72" rx="20" fill="#1b2b3b" stroke="#40556b" stroke-width="2"/><text x="103" y="478" font-size="27" fill="#edf4fc" font-weight="700"><tspan x="103" dy="0">PAPEL</tspan></text><rect x="61" y="452" width="27" height="30" rx="4" fill="none" stroke="#76e5b6" stroke-width="3"/><path d="M349 468 H405 V330 H467" fill="none" stroke="#76e5b6" stroke-width="4" marker-end="url(#arrow)"/><rect x="480" y="216" width="420" height="226" rx="20" fill="#1b2b3b" stroke="#40556b" stroke-width="2"/><circle cx="557" cy="270" r="22" fill="#bda7ff"/><path d="M525 315 Q557 280 589 315" fill="none" stroke="#bda7ff" stroke-width="10" stroke-linecap="round"/><circle cx="638" cy="270" r="22" fill="#76e5b6"/><path d="M606 315 Q638 280 670 315" fill="none" stroke="#76e5b6" stroke-width="10" stroke-linecap="round"/><text x="514" y="366" font-size="31" fill="#edf4fc" font-weight="700"><tspan x="514" dy="0">Sofía y Paula</tspan></text><text x="514" y="408" font-size="25" fill="#edf4fc" font-weight="400"><tspan x="514" dy="0">Recepción y carga manual</tspan></text><path d="M910 330 H982" fill="none" stroke="#76e5b6" stroke-width="4" marker-end="url(#arrow)"/><rect x="997" y="216" width="363" height="226" rx="20" fill="#1b2b3b" stroke="#40556b" stroke-width="2"/><text x="1025" y="265" font-size="29" fill="#76e5b6" font-weight="700"><tspan x="1025" dy="0">PLANILLA</tspan></text><rect x="1030" y="294" width="290" height="75" fill="none" stroke="#5c7189" stroke-width="2"/><path d="M1030 319 H1320 M1030 344 H1320 M1120 294 V369 M1230 294 V369" stroke="#5c7189" stroke-width="2"/><text x="1025" y="413" font-size="25" fill="#edf4fc" font-weight="400"><tspan