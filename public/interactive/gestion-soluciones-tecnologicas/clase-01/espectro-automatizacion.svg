<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc"><title id="title">Cuatro escalones y una vía lateral</title><desc id="desc">Cuatro opciones: asistente para una tarea revisada; flujo con pasos definidos; agente con elección de herramientas dentro de límites; prototipo con pantallas y datos propios. RPA es una vía lateral para sistemas sin otra conexión adecuada. La elección depende de la necesidad, no de subir siempre de nivel.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#76e5b6" stroke-width="1.5"/></marker></defs><rect width="1400" height="620" rx="26" fill="#101821"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="45" font-size="20" fill="#a4b6ca" font-weight="700"><tspan x="40" dy="0">GESTIÓN TECNOLÓGICA + AUTOMATIZACIÓN  /  CLASE 1</tspan></text><text x="40" y="108" font-size="40" fill="#edf4fc" font-weight="700"><tspan x="40" dy="0">Elegí el nivel que la tarea necesita</tspan></text><rect x="40" y="153" width="760" height="78" rx="20" fill="#1b2b3b" stroke="#40556b" stroke-width="2"/><circle cx="82" cy="192" r="25" fill="#76e5b6"/><text x="73" y="202" font-size="28" fill="#101821" font-weight="700"><tspan x="73" dy="0">1</tspan></text><text x="126" y="185" font-size="26" fill="#76e5b6" font-weight="700"><tspan x="126" dy="0">ASISTENTE</tspan></text><text x="126" y="216" font-size="25" fill="#edf4fc" font-weight="400"><tspan x="126" dy="0">Una tarea pedida y revisada</tspan></text><rect x="110" y="244" width="760" height="78" rx="20" fill="#1b2b3b" stroke="#40556b" stroke-width="2"/><circle cx="152" cy="283" r="25" fill="#76e5b6"/><text x="143" y="293" font-size="28" fill="#101821" font-weight="700"><tspan x="143" dy="0">2</tspan></text><text x="196" y="276" font-size="26" fill="#76e5b6" font-weight="700"><tspan x="196" dy="0">FLUJO</tspan></text><text x="196" y="307" font-size="25" fill="#edf4fc" font-weight="400"><tspan x="196" dy="0">Pasos y reglas definidos</tspan></text><rect x="180" y="335" width="760" height="78" rx="20" fill="#1b2b3b" stroke="#40556b" stroke-width="2"/><circle cx="222" cy="374" r="25" fill="#76e5b6"/><text x="213" y="384" font-size="28" fill="#101821" font-weight="700"><tspan x="213" dy="0">3</tspan></text><text x="266" y="367" font-size="26" fill="#76e5b6" font-weight="700"><tspan x="266" dy="0">AGENTE</tspan></text><text x="266" y="398" font-size="25" fill="#edf4fc" font-weight="400"><tspan x="266" dy="0">Herramientas dentro de límites</tspan></text><rect x="250" y="426" width="760" height="78" rx="20" fill="#1b2b3b" stroke="#40556b" stroke-width="2"/><circle cx="292" cy="465" r="25" fill="#76e5b6"/><text x="283" y="475" font-size="28" fill="#101821" font-weight="700"><tspan x="283" dy="0">4</tspan></text><text x="336" y="458" font-size="26" fill="#76e5b6" font-weight="700"><tspan x="336" dy="0">PROTOTIPO</tspan></text><text x="336" y="489" font-size="25" fill="#edf4fc" font-weight="400"><tspan x="336" dy="0">Pantallas y datos propios</tspan></text><rect x="925" y="154" width="435" height="163" rx="20" fill="#292b38" stroke="#bda7ff" stroke-width="2"/><text x="953" y="200" font-size="29" fill="#bda7ff" font-weight="700"><tspan x="953" dy="0">RPA · VÍA LATERAL</tspan></text><text x="953" y="243" font-size="25" fill="#edf4fc" font-weight="400"><tspan x="953" dy="0">Operar por pantalla</tspan><tspan x="953" dy="33.75">sin otra conexión adecuada</tspan></text><path d="M870 283 H902 V240 H916" fill="none" stroke="#76e5b6" stroke-width="4" marker-end="url(#arrow)"/><text x="40" y="570" font-size="29" fill="#edf4fc" font-weight="700"><tspan x="40" dy="0">Más autonomía debe aportar valor y tener controles.</tspan></text></g></svg>
