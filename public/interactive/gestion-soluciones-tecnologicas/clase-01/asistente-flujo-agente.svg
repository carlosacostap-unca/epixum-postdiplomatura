<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc"><title id="title">Asistente, flujo y agente</title><desc id="desc">Asistente: pedido y borrador revisado. Flujo: pasos fijados antes de ejecutar. Agente: elige próximos pasos según resultados. Pueden combinarse; usar una herramienta por sí solo no convierte un sistema en agente.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#7ee6c1" stroke-width="1.5"/></marker></defs><rect width="1280" height="560" rx="24" fill="#101c2b"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="38" text-anchor="start" font-size="18" fill="#b6c9db" font-weight="700"><tspan x="36" dy="0">GESTIÓN TECNOLÓGICA  /  BASES DE INTELIGENCIA ARTIFICIAL</tspan></text><text x="36" y="100" text-anchor="start" font-size="40" fill="#f1f6fc" font-weight="700"><tspan x="36" dy="0">¿Quién define el siguiente paso?</tspan></text><rect x="36" y="150" width="386" height="312" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><text x="62" y="198" text-anchor="start" font-size="29" fill="#7ee6c1" font-weight="700"><tspan x="62" dy="0">ASISTENTE</tspan></text><g transform="translate(75 242) scale(1)" fill="none" stroke="#7ee6c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="20" r="14"/><path d="M9 69v-8a27 27 0 0 1 54 0v8"/></g><path d="M167 278H247" fill="none" stroke="#7ee6c1" stroke-width="4" marker-end="url(#a)"/><g transform="translate(275 242) scale(1)" fill="none" stroke="#7ee6c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h31l15 15v51H15zM46 4v17h15M25 34h25M25 46h25M25 58h15"/></g><text x="64" y="371" text-anchor="start" font-size="28" fill="#f1f6fc" font-weight="400"><tspan x="64" dy="0">Pedido → borrador</tspan><tspan x="64" dy="36.4">La persona revisa</tspan></text><rect x="446" y="150" width="386" height="312" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><text x="473" y="198" text-anchor="start" font-size="29" fill="#c6b2ff" font-weight="700"><tspan x="473" dy="0">FLUJO</tspan></text><rect x="480" y="252" width="80" height="57" rx="12" fill="#302e49" stroke="#c6b2ff" stroke-width="2"/><text x="520" y="291" text-anchor="middle" font-size="28" fill="#f1f6fc" font-weight="600"><tspan x="520" dy="0">1</tspan></text><rect x="594" y="252" width="80" height="57" rx="12" fill="#302e49" stroke="#c6b2ff" stroke-width="2"/><text x="634" y="291" text-anchor="middle" font-size="28" fill="#f1f6fc" font-weight="600"><tspan x="634" dy="0">2</tspan></text><rect x="708" y="252" width="80" height="57" rx="12" fill="#302e49" stroke="#c6b2ff" stroke-width="2"/><text x="748" y="291" text-anchor="middle" font-size="28" fill="#f1f6fc" font-weight="600"><tspan x="748" dy="0">3</tspan></text><path d="M566 280H588" fill="none" stroke="#7ee6c1" stroke-width="4" marker-end="url(#a)"/><path d="M680 280H702" fill="none" stroke="#7ee6c1" stroke-width="4" marker-end="url(#a)"/><text x="474" y="371" text-anchor="start" font-size="28" fill="#f1f6fc" font-weight="400"><tspan x="474" dy="0">Secuencia prevista</tspan><tspan x="474" dy="36.4">Puede incorporar IA</tspan></text><rect x="856" y="150" width="388" height="312" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><text x="883" y="198" text-anchor="start" font-size="29" fill="#ffd08a" font-weight="700"><tspan x="883" dy="0">AGENTE</tspan></text><g transform="translate(887 240) scale(1)" fill="none" stroke="#ffd08a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="17" y="17" width="38" height="38" rx="7"/><path d="M27 4v13M45 4v13M27 55v13M45 55v13M4 27h13M4 45h13M55 27h13M55 45h13"/><circle cx="36" cy="36" r="8"/></g><path d="M976 275H1060" fill="none" stroke="#7ee6c1" stroke-width="4" marker-end="url(#a)"/><g transform="translate(1094 240) scale(1)" fill="none" stroke="#7ee6c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M48 6a22 22 0 0 0-25 28L6 51a11 11 0 0 0 15 15l17-17A22 22 0 0 0 65 23L49 36 36 23z"/></g><path d="M1125 324V338H921V320" fill="none" stroke="#7ee6c1" stroke-width="4" marker-end="url(#a)"/><text x="884" y="386" text-anchor="start" font-size="28" fill="#f1f6fc" font-weight="400"><tspan x="884" dy="0">Elige cómo seguir</tspan><tspan x="884" dy="36.4">según el resultado</tspan></text><text x="36" y="525" text-anchor="start" font-size="25" fill="#b6c9db" font-weight="400"><tspan x="36" dy="0">Pueden combinarse: una aplicación no tiene que pertenecer a una sola categoría.</tspan></text></g></svg>
