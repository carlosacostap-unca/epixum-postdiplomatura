<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc"><title id="title">Generar, buscar y recuperar</title><desc id="desc">Generar produce contenido. Buscar consulta una fuente con una herramienta. Recuperar selecciona información relevante para aportarla como contexto. Las fuentes también se verifican.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#7ee6c1" stroke-width="1.5"/></marker></defs><rect width="1280" height="560" rx="24" fill="#101c2b"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="38" text-anchor="start" font-size="18" fill="#b6c9db" font-weight="700"><tspan x="36" dy="0">GESTIÓN TECNOLÓGICA  /  BASES DE INTELIGENCIA ARTIFICIAL</tspan></text><text x="36" y="100" text-anchor="start" font-size="39" fill="#f1f6fc" font-weight="700"><tspan x="36" dy="0">Tres operaciones que pueden combinarse</tspan></text><rect x="36" y="155" width="386" height="240" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><g transform="translate(60 177) scale(1)" fill="none" stroke="#7ee6c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h60v43H32L17 65V51H6z"/><path d="M19 22h34M19 35h23"/></g><text x="60" y="288" text-anchor="start" font-size="31" fill="#7ee6c1" font-weight="700"><tspan x="60" dy="0">Generar</tspan></text><text x="60" y="335" text-anchor="start" font-size="27" fill="#f1f6fc" font-weight="400"><tspan x="60" dy="0">Producir una</tspan><tspan x="60" dy="35.1">respuesta</tspan></text><rect x="446" y="155" width="386" height="240" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><g transform="translate(470 177) scale(1)" fill="none" stroke="#c6b2ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="36" r="29"/><ellipse cx="36" cy="36" rx="13" ry="29"/><path d="M7 36h58M12 21h48M12 51h48"/></g><text x="470" y="288" text-anchor="start" font-size="31" fill="#c6b2ff" font-weight="700"><tspan x="470" dy="0">Buscar</tspan></text><text x="470" y="335" text-anchor="start" font-size="27" fill="#f1f6fc" font-weight="400"><tspan x="470" dy="0">Consultar una</tspan><tspan x="470" dy="35.1">fuente externa</tspan></text><rect x="856" y="155" width="388" height="240" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><g transform="translate(880 177) scale(1)" fill="none" stroke="#ffd08a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h26l7 10h29v37H5zM5 17V9h23l8 8h28v10"/></g><text x="880" y="288" text-anchor="start" font-size="31" fill="#ffd08a" font-weight="700"><tspan x="880" dy="0">Recuperar</tspan></text><text x="880" y="335" text-anchor="start" font-size="27" fill="#f1f6fc" font-weight="400"><tspan x="880" dy="0">Traer información</tspan><tspan x="880" dy="35.1">relevante al contexto</tspan></text><text x="36" y="485" text-anchor="start" font-size="29" fill="#7ee6c1" font-weight="400"><tspan x="36" dy="0">RAG: recuperar información y usarla al generar la respuesta.</tspan></text></g></svg>
