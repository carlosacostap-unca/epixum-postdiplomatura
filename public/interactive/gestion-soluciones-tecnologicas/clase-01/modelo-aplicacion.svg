<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc"><title id="title">Modelo y aplicación</title><desc id="desc">La aplicación contiene una interfaz y puede combinar un modelo con archivos, búsqueda y otras herramientas. No todas las aplicaciones tienen las mismas funciones.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#7ee6c1" stroke-width="1.5"/></marker></defs><rect width="1280" height="560" rx="24" fill="#101c2b"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="38" text-anchor="start" font-size="18" fill="#b6c9db" font-weight="700"><tspan x="36" dy="0">GESTIÓN TECNOLÓGICA  /  BASES DE INTELIGENCIA ARTIFICIAL</tspan></text><text x="36" y="100" text-anchor="start" font-size="40" fill="#f1f6fc" font-weight="700"><tspan x="36" dy="0">El modelo es una parte de la aplicación</tspan></text><rect x="36" y="140" width="1208" height="345" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><text x="65" y="186" text-anchor="start" font-size="27" fill="#7ee6c1" font-weight="700"><tspan x="65" dy="0">APLICACIÓN</tspan></text><rect x="65" y="214" width="305" height="225" rx="22" fill="#243f53" stroke="#36526a" stroke-width="2"/><g transform="translate(87 244) scale(1)" fill="none" stroke="#7ee6c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="20" r="14"/><path d="M9 69v-8a27 27 0 0 1 54 0v8"/></g><text x="178" y="270" text-anchor="start" font-size="27" fill="#f1f6fc" font-weight="400"><tspan x="178" dy="0">Interfaz</tspan><tspan x="178" dy="35.1">para la persona</tspan></text><path d="M386 322H458" fill="none" stroke="#7ee6c1" stroke-width="4" marker-end="url(#a)"/><rect x="478" y="214" width="310" height="225" rx="22" fill="#302e49" stroke="#c6b2ff" stroke-width="2"/><g transform="translate(503 244) scale(1)" fill="none" stroke="#c6b2ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="17" y="17" width="38" height="38" rx="7"/><path d="M27 4v13M45 4v13M27 55v13M45 55v13M4 27h13M4 45h13M55 27h13M55 45h13"/><circle cx="36" cy="36" r="8"/></g><text x="590" y="273" text-anchor="start" font-size="31" fill="#c6b2ff" font-weight="700"><tspan x="590" dy="0">Modelo</tspan></text><text x="503" y="393" text-anchor="start" font-size="28" fill="#f1f6fc" font-weight="400"><tspan x="503" dy="0">Procesa y genera</tspan></text><path d="M805 322H875" fill="none" stroke="#7ee6c1" stroke-width="4" marker-end="url(#a)"/><g transform="translate(919 222) scale(1)" fill="none" stroke="#7ee6c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h26l7 10h29v37H5zM5 17V9h23l8 8h28v10"/></g><g transform="translate(1054 222) scale(1)" fill="none" stroke="#7ee6c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="36" r="29"/><ellipse cx="36" cy="36" rx="13" ry="29"/><path d="M7 36h58M12 21h48M12 51h48"/></g><text x="907" y="348" text-anchor="start" font-size="27" fill="#f1f6fc" font-weight="400"><tspan x="907" dy="0">Archivos, búsqueda</tspan><tspan x="907" dy="35.1">y herramientas*</tspan></text><text x="65" y="526" text-anchor="start" font-size="25" fill="#b6c9db" font-weight="400"><tspan x="65" dy="0">*Según lo que la aplicación tenga disponible y autorizado.</tspan></text></g></svg>
