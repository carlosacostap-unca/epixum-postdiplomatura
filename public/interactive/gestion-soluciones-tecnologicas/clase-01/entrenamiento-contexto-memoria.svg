<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc"><title id="title">Entrenamiento, contexto y memoria</title><desc id="desc">Tres conceptos diferentes: el entrenamiento ajusta capacidades del modelo; el contexto aporta información para una respuesta; la memoria de la aplicación conserva y recupera información entre interacciones.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#7ee6c1" stroke-width="1.5"/></marker></defs><rect width="1280" height="560" rx="24" fill="#101c2b"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="38" text-anchor="start" font-size="18" fill="#b6c9db" font-weight="700"><tspan x="36" dy="0">GESTIÓN TECNOLÓGICA  /  BASES DE INTELIGENCIA ARTIFICIAL</tspan></text><text x="36" y="100" text-anchor="start" font-size="40" fill="#f1f6fc" font-weight="700"><tspan x="36" dy="0">Tres conceptos que conviene separar</tspan></text><rect x="36" y="154" width="386" height="240" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><g transform="translate(60 176) scale(1)" fill="none" stroke="#c6b2ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M36 17Q18 6 5 13v49q14-7 31 4 18-11 31-4V13q-14-7-31 4v49"/></g><text x="60" y="287" text-anchor="start" font-size="31" fill="#c6b2ff" font-weight="700"><tspan x="60" dy="0">Entrenamiento</tspan></text><text x="60" y="334" text-anchor="start" font-size="27" fill="#f1f6fc" font-weight="400"><tspan x="60" dy="0">Ajusta capacidades</tspan><tspan x="60" dy="35.1">del modelo</tspan></text><rect x="446" y="154" width="386" height="240" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><g transform="translate(470 176) scale(1)" fill="none" stroke="#7ee6c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h31l15 15v51H15zM46 4v17h15M25 34h25M25 46h25M25 58h15"/></g><text x="470" y="287" text-anchor="start" font-size="31" fill="#7ee6c1" font-weight="700"><tspan x="470" dy="0">Contexto</tspan></text><text x="470" y="334" text-anchor="start" font-size="27" fill="#f1f6fc" font-weight="400"><tspan x="470" dy="0">Información disponible</tspan><tspan x="470" dy="35.1">para esta respuesta</tspan></text><rect x="856" y="154" width="388" height="240" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><g transform="translate(880 176) scale(1)" fill="none" stroke="#ffd08a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h26l7 10h29v37H5zM5 17V9h23l8 8h28v10"/></g><text x="880" y="287" text-anchor="start" font-size="31" fill="#ffd08a" font-weight="700"><tspan x="880" dy="0">Memoria</tspan></text><text x="880" y="334" text-anchor="start" font-size="27" fill="#f1f6fc" font-weight="400"><tspan x="880" dy="0">Conserva y recupera</tspan><tspan x="880" dy="35.1">según la aplicación</tspan></text><text x="36" y="487" text-anchor="start" font-size="29" fill="#b6c9db" font-weight="400"><tspan x="36" dy="0">Conversar no implica reentrenar inmediatamente el modelo.</tspan></text></g></svg>
