<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc"><title id="title">De los módulos previos al componente tecnológico</title><desc id="desc">El To-Be del Módulo 1, las instrucciones y revisión de IA del Módulo 2 y la adopción y responsabilidades del Módulo 3 se integran en el Módulo 4: construir, probar y justificar un componente tecnológico que aporta al TFI.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#76e5b6" stroke-width="1.5"/></marker></defs><rect width="1400" height="620" rx="26" fill="#101821"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="45" font-size="20" fill="#a4b6ca" font-weight="700"><tspan x="40" dy="0">GESTIÓN TECNOLÓGICA + AUTOMATIZACIÓN  /  CLASE 1</tspan></text><text x="40" y="108" font-size="40" fill="#edf4fc" font-weight="700"><tspan x="40" dy="0">Lo que ya construiste se conecta acá</tspan></text><rect x="40" y="152" width="420" height="180" rx="20" fill="#1b2b3b" stroke="#40556b" stroke-width="2"/><circle cx="85" cy="195" r="25" fill="#76e5b6"/><text x="76" y="205" font-size="28" fill="#101821" font-weight="700"><tspan x="76" dy="0">1</tspan></text><text x="124" y="205" font-size="27" fill="#76e5b6" font-weight="700"><tspan x="124" dy="0">PROCESOS</tspan></text><text x="68" y="265" font-size="29" fill="#edf4fc" font-weight="400"><tspan x="68" dy="0">To-Be</tspan><tspan x="68" dy="39.150000000000006">Tareas rediseñadas</tspan></text><rect x="490" y="152" width="420" height="180" rx="20" fill="#1b2b3b" stroke="#40556b" stroke-width="2"/><circle cx="535" cy="195" r="25" fill="#76e5b6"/><text x="526" y="205" font-size="28" fill="#101821" font-weight="700"><tspan x="526" dy="0">2</tspan></text><text x="574" y="205" font-size="27" fill="#76e5b6" font-weight="700"><tspan x="574" dy="0">IA GENERATIVA</tspan></text><text x="518" y="265" font-size="29" fill="#edf4fc" font-weight="400"><tspan x="518" dy="0">Instrucciones</tspan><tspan x="518" dy="39.150000000000006">Revisión y datos</tspan></text><rect x="940" y="152" width="420" height="180" rx="20" fill="#1b2b3b" stroke="#40556b" stroke-width="2"/><circle cx="985" cy="195" r="25" fill="#76e5b6"/><text x="976" y="205" font-size="28" fill="#101821" font-weight="700"><tspan x="976" dy="0">3</tspan></text><text x="1024" y="205" font-size="27" fill="#76e5b6" font-weight="700"><tspan x="1024" dy="0">CAMBIO</tspan></text><text x="968" y="265" font-size="29" fill="#edf4fc" font-weight="400"><tspan x="968" dy="0">Adopción</tspan><tspan x="968" dy="39.150000000000006">Responsabilidades</tspan></text><path d="M250 340 V365 H700 V395" fill="none" stroke="#76e5b6" stroke-width="4" marker-end="url(#arrow)"/><path d="M700 340 V395" fill="none" stroke="#76e5b6" stroke-width="4" marker-end="url(#arrow)"/><path d="M1150 340 V365 H700 V395" fill="none" stroke="#76e5b6" stroke-width="4" marker-end="url(#arrow)"/><rect x="230" y="404" width="940" height="142" rx="20" fill="#263342" stroke="#76e5b6" stroke-width="2"/><text x="268" y="453" font-size="30" fill="#76e5b6" font-weight="700"><tspan x="268" dy="0">MÓDULO 4  ·  CONSTRUIR → PROBAR → JUSTIFICAR</tspan></text><text x="268" y="505" font-size="32" fill="#edf4fc" font-weight="400"><tspan x="268" dy="0">Componente tecnológico que aporta al TFI</tspan></text><text x="40" y="591" font-size="27" fill="#a4b6ca" font-weight="400"><tspan x="40" dy="0">Partimos del proceso y de las personas; luego elegimos la solución.</tspan></text></g></svg>
