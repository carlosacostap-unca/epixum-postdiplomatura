<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc"><title id="title">Contrastar respuesta y evidencia</title><desc id="desc">La ficha confirma jueves a las 18:00 y modalidad virtual. En el ejemplo preparado, gratuidad y certificado no están respaldados: deben retirarse o verificarse.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#7ee6c1" stroke-width="1.5"/></marker></defs><rect width="1280" height="560" rx="24" fill="#101c2b"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="38" text-anchor="start" font-size="18" fill="#b6c9db" font-weight="700"><tspan x="36" dy="0">GESTIÓN TECNOLÓGICA  /  BASES DE INTELIGENCIA ARTIFICIAL</tspan></text><text x="36" y="100" text-anchor="start" font-size="40" fill="#f1f6fc" font-weight="700"><tspan x="36" dy="0">Una respuesta se contrasta con evidencia</tspan></text><rect x="36" y="145" width="475" height="326" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><g transform="translate(59 165) scale(1)" fill="none" stroke="#7ee6c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h31l15 15v51H15zM46 4v17h15M25 34h25M25 46h25M25 58h15"/></g><text x="155" y="208" text-anchor="start" font-size="29" fill="#7ee6c1" font-weight="700"><tspan x="155" dy="0">FICHA</tspan></text><text x="65" y="292" text-anchor="start" font-size="32" fill="#f1f6fc" font-weight="400"><tspan x="65" dy="0">Jueves · 18:00</tspan><tspan x="65" dy="41.6">Modalidad virtual</tspan></text><text x="65" y="406" text-anchor="start" font-size="27" fill="#b6c9db" font-weight="400"><tspan x="65" dy="0">Sin datos de precio</tspan><tspan x="65" dy="35.1">ni certificado</tspan></text><path d="M526 303H603" fill="none" stroke="#7ee6c1" stroke-width="4" marker-end="url(#a)"/><rect x="620" y="145" width="624" height="326" rx="22" fill="#1b3044" stroke="#36526a" stroke-width="2"/><text x="649" y="208" text-anchor="start" font-size="29" fill="#c6b2ff" font-weight="700"><tspan x="649" dy="0">RESPUESTA PREPARADA</tspan></text><text x="649" y="279" text-anchor="start" font-size="31" fill="#f1f6fc" font-weight="400"><tspan x="649" dy="0">Jueves a las 18:00</tspan></text><text x="1158" y="279" text-anchor="start" font-size="34" fill="#7ee6c1" font-weight="700"><tspan x="1158" dy="0">✓</tspan></text><rect x="644" y="315" width="570" height="95" rx="12" fill="#463b2c" stroke="#ffd08a" stroke-width="2"/><text x="665" y="350" text-anchor="start" font-size="28" fill="#ffd08a" font-weight="400"><tspan x="665" dy="0">«Gratuito y con certificado»</tspan><tspan x="665" dy="36.4">No está sustentado en la ficha</tspan></text><text x="36" y="520" text-anchor="start" font-size="26" fill="#b6c9db" font-weight="400"><tspan x="36" dy="0">Ejemplo didáctico preparado · No es una ejecución registrada de IA.</tspan></text></g></svg>
