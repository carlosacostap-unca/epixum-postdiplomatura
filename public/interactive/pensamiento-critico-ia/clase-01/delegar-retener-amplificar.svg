<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">Tres formas de trabajar con un asistente</title><desc id="desc">Tres formas de trabajar con un asistente: delegar una tarea revisable, como dar formato; retener el juicio sobre el problema, la evidencia y la decisión; amplificar el análisis pidiendo alternativas y objeciones para evaluarlas.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#76e5b6" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="560" rx="28" fill="#101821"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="48" y="51" font-size="20" fill="#a4b6ca" font-weight="700">PENSAMIENTO CRÍTICO + IA  /  CLASE 1</text><rect x="48" y="88" width="378" height="400" rx="22" fill="#1d2b3b"/><circle cx="100" cy="142" r="28" fill="#76e5b6"/><text x="83" y="152" font-size="28" fill="#101821" font-weight="700">01</text><text x="76" y="218" font-size="34" fill="#76e5b6" font-weight="700">DELEGAR</text><text x="76" y="273" font-size="29" fill="#eef3f8" font-weight="400">Tareas revisables</text><text x="76" y="311" font-size="29" fill="#eef3f8" font-weight="400">y de bajo costo</text><text x="76" y="349" font-size="29" fill="#eef3f8" font-weight="400">de error.</text><path d="M76 377 H398" stroke="#43556b"/><text x="76" y="420" font-size="26" fill="#bed0e3" font-weight="400">Dar formato</text><text x="76" y="454" font-size="26" fill="#bed0e3" font-weight="400">a una tabla.</text><rect x="451" y="88" width="378" height="400" rx="22" fill="#1d2b3b"/><circle cx="503" cy="142" r="28" fill="#ffbb9b"/><text x="486" y="152" font-size="28" fill="#101821" font-weight="700">02</text><text x="479" y="218" font-size="34" fill="#ffbb9b" font-weight="700">RETENER</text><text x="479" y="273" font-size="29" fill="#eef3f8" font-weight="400">El problema,</text><text x="479" y="311" font-size="29" fill="#eef3f8" font-weight="400">la evidencia</text><text x="479" y="349" font-size="29" fill="#eef3f8" font-weight="400">y la decisión.</text><path d="M479 377 H801" stroke="#43556b"/><text x="479" y="420" font-size="26" fill="#bed0e3" font-weight="400">Evaluar qué dato</text><text x="479" y="454" font-size="26" fill="#bed0e3" font-weight="400">es confiable.</text><rect x="854" y="88" width="378" height="400" rx="22" fill="#1d2b3b"/><circle cx="906" cy="142" r="28" fill="#bda7ff"/><text x="889" y="152" font-size="28" fill="#101821" font-weight="700">03</text><text x="882" y="218" font-size="34" fill="#bda7ff" font-weight="700">AMPLIFICAR</text><text x="882" y="273" font-size="29" fill="#eef3f8" font-weight="400">Más alternativas</text><text x="882" y="311" font-size="29" fill="#eef3f8" font-weight="400">y objeciones</text><text x="882" y="349" font-size="29" fill="#eef3f8" font-weight="400">para evaluar.</text><path d="M882 377 H1204" stroke="#43556b"/><text x="882" y="420" font-size="26" fill="#bed0e3" font-weight="400">Pedir objeciones</text><text x="882" y="454" font-size="26" fill="#bed0e3" font-weight="400">y contrastarlas.</text><text x="48" y="533" font-size="27" fill="#a4b6ca" font-weight="400">Registrá qué aportó el asistente y qué resolviste vos.</text></g></svg>
