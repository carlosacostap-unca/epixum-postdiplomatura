<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">Hacer visibles los supuestos del razonamiento</title><desc id="desc">El razonamiento conecta información con una conclusión y se apoya en supuestos. Preguntá qué datos usa, qué concluye y qué tendría que ser cierto para que esa conclusión sea válida.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#76e5b6" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="560" rx="28" fill="#101821"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="48" y="51" font-size="20" fill="#a4b6ca" font-weight="700">PENSAMIENTO CRÍTICO + IA  /  CLASE 1</text><rect x="48" y="104" width="470" height="185" rx="22" fill="#1d2b3b"/><rect x="762" y="104" width="470" height="185" rx="22" fill="#1d2b3b"/><text x="80" y="160" font-size="32" fill="#76e5b6" font-weight="700">INFORMACIÓN</text><text x="80" y="220" font-size="30" fill="#eef3f8" font-weight="400">¿Qué datos usa?</text><path d="M540 196 L738 196" fill="none" stroke="#76e5b6" stroke-width="4" marker-end="url(#arrow)"/><text x="555" y="159" font-size="22" fill="#a4b6ca" font-weight="400">razonamiento</text><text x="794" y="160" font-size="32" fill="#76e5b6" font-weight="700">CONCLUSIÓN</text><text x="794" y="220" font-size="30" fill="#eef3f8" font-weight="400">¿Qué concluye?</text><rect x="246" y="356" width="788" height="145" rx="22" fill="#302e44"/><path d="M640 343 L640 235" fill="none" stroke="#76e5b6" stroke-width="4" marker-end="url(#arrow)"/><text x="278" y="406" font-size="28" fill="#c8b5ff" font-weight="700">SUPUESTOS</text><text x="278" y="451" font-size="28" fill="#eef3f8" font-weight="400">¿Qué da por sentado para pasar de uno a otro?</text><text x="48" y="540" font-size="28" fill="#eef3f8" font-weight="400">¿Qué tendría que ser cierto para que esta conclusión fuera válida?</text></g></svg>
