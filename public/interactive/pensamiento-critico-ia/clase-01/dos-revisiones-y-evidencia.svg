<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">Dos revisiones que también necesitan evidencia</title><desc id="desc">Compará tu análisis previo con la autocrítica del asistente. Contrastá las coincidencias y diferencias con evidencia: una corrección puede quedar comprobada o seguir pendiente. La autocrítica no valida por sí sola la respuesta.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#76e5b6" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="560" rx="28" fill="#101821"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="48" y="51" font-size="20" fill="#a4b6ca" font-weight="700">PENSAMIENTO CRÍTICO + IA  /  CLASE 1</text><rect x="48" y="100" width="550" height="150" rx="22" fill="#1d2b3b"/><rect x="682" y="100" width="550" height="150" rx="22" fill="#1d2b3b"/><text x="80" y="152" font-size="30" fill="#76e5b6" font-weight="700">TU ANÁLISIS PREVIO</text><text x="80" y="205" font-size="27" fill="#eef3f8" font-weight="400">Lo que encontraste por tu cuenta.</text><text x="714" y="152" font-size="27" fill="#bda7ff" font-weight="700">AUTOCRÍTICA DEL ASISTENTE</text><text x="714" y="205" font-size="27" fill="#eef3f8" font-weight="400">Lo que propone al revisar su texto.</text><path d="M323 269 L486 326" fill="none" stroke="#76e5b6" stroke-width="4" marker-end="url(#arrow)"/><path d="M957 269 L794 326" fill="none" stroke="#76e5b6" stroke-width="4" marker-end="url(#arrow)"/><rect x="310" y="343" width="660" height="154" rx="22" fill="#243c3c"/><text x="342" y="394" font-size="31" fill="#76e5b6" font-weight="700">CONTRASTAR CON EVIDENCIA</text><text x="342" y="445" font-size="27" fill="#eef3f8" font-weight="400">¿Qué se comprobó? ¿Qué sigue pendiente?</text><text x="48" y="540" font-size="28" fill="#eef3f8" font-weight="400">La autocrítica es otra respuesta que necesita revisión.</text></g></svg>
