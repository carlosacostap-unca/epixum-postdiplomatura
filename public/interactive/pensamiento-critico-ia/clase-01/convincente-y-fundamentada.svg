<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">Sonar convincente y tener fundamento son cosas distintas</title><desc id="desc">Una respuesta puede sonar convincente por su claridad, sus cifras y su tono seguro. Para evaluar su fundamento hay que comprobar datos, revisar fuentes y justificar conclusiones. La forma por sí sola no demuestra la verdad.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#76e5b6" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="560" rx="28" fill="#101821"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="48" y="51" font-size="20" fill="#a4b6ca" font-weight="700">PENSAMIENTO CRÍTICO + IA  /  CLASE 1</text><rect x="48" y="86" width="550" height="354" rx="22" fill="#1d2b3b"/><rect x="682" y="86" width="550" height="354" rx="22" fill="#1d2b3b"/><text x="80" y="138" font-size="23" fill="#bda7ff" font-weight="700">CÓMO ESTÁ ESCRITO</text><text x="80" y="194" font-size="39" fill="#eef3f8" font-weight="700">Parece convincente</text><text x="80" y="260" font-size="30" fill="#eef3f8" font-weight="400">Texto claro y ordenado</text><text x="80" y="316" font-size="30" fill="#eef3f8" font-weight="400">Cifras y citas</text><text x="80" y="372" font-size="30" fill="#eef3f8" font-weight="400">Tono seguro</text><text x="638" y="287" font-size="54" fill="#ffbb9b" font-weight="700">≠</text><text x="714" y="138" font-size="23" fill="#76e5b6" font-weight="700">QUÉ LO RESPALDA</text><text x="714" y="194" font-size="35" fill="#eef3f8" font-weight="700">Revisamos el fundamento</text><text x="714" y="260" font-size="30" fill="#eef3f8" font-weight="400">Comprobar los datos</text><text x="714" y="316" font-size="30" fill="#eef3f8" font-weight="400">Revisar las fuentes</text><text x="714" y="372" font-size="30" fill="#eef3f8" font-weight="400">Justificar las conclusiones</text><text x="80" y="509" font-size="32" fill="#76e5b6" font-weight="700">La forma ayuda a leer. La evidencia ayuda a evaluar.</text></g></svg>
